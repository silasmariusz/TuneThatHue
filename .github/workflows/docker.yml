# Build the container for three architectures and publish it.
#
# Two registries: GitHub's, which needs no setup, and Docker Hub, which needs a token.
# The Docker Hub step is skipped when the secrets are absent, so a fork builds fine
# without them.
#
# Set these repository secrets to publish to Docker Hub:
#   DOCKERHUB_USERNAME   your Docker Hub account
#   DOCKERHUB_TOKEN      an access token from hub.docker.com/settings/security

name: docker

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Secrets can be read here but not in a step's `if:`, and not in workflow-level env
    # at all. So everything a condition needs is turned into a plain string here first -
    # otherwise the run is rejected before a single step starts, which is what happened.
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tunethathue
      HUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tunethathue
      HAS_HUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated on the runner; slow, but it is a small image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.HAS_HUB == 'true' && env.HUB_IMAGE || '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # No 32-bit ARM. numpy publishes no wheel for it on Python 3.14 - only x86_64
          # and aarch64 - so that leg tried to compile numpy from source inside a slim
          # image with no compiler, and took the whole build down with it. Adding a
          # toolchain would mean an hour of emulated compiling per build for the one
          # architecture that has a better route anyway: 32-bit boards can use the QNAP
          # package or the Linux install script, which bring their own runtime.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
