<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TuneThatHue">
  <defs>
    <!-- the hue wheel laid flat: the top half is the light, and the only colour in the mark -->
    <linearGradient id="tth-hue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FF2D6F"/>
      <stop offset=".17" stop-color="#FF8A1E"/>
      <stop offset=".33" stop-color="#FFD426"/>
      <stop offset=".50" stop-color="#43E07F"/>
      <stop offset=".67" stop-color="#22D3EE"/>
      <stop offset=".84" stop-color="#5B7CFA"/>
      <stop offset="1"   stop-color="#C43BE0"/>
    </linearGradient>
    <!-- the cut is the 1.8 px the two clips leave between them, at the tile's own midline -->
    <clipPath id="tth-top"><rect x="0" y="0" width="64" height="31.1"/></clipPath>
    <clipPath id="tth-bot"><rect x="0" y="32.9" width="64" height="31.1"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="12" fill="#0A0B0D"/>

  <g clip-path="url(#tth-top)">
    <path transform="translate(8 15.4) scale(1.3793)" fill="url(#tth-hue)" fill-rule="evenodd"
