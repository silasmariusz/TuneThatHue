          d="M18.5,17.8h-8.5V5.6h13.3v9.3c4,1.2,6.7,2.6,8.6,4.1.3-.7.5-1.6.5-2.6V6.1C32.4,2.3,29.9.2,25.1,0h0s-.8,0-.8,0c0,0,0,0,0,0h0s-16,0-16,0C2.7,0,0,2.1,0,6.1v11.3c0,4.1,2.7,6.1,8.2,6.1h14.5c.8,0,1.6,0,2.3-.2-1.4-1.9-4.2-4-6.6-5.6ZM16.8,15.1c2.8,1.6,9.1,5.5,10.9,8.9h7.1c-1-1.8-5-7-18-8.9Z"/>
