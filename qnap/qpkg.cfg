# TuneThatHue - QNAP package config (QDK).
QPKG_NAME="TuneThatHue"
QPKG_DISPLAY_NAME="TuneThatHue"
QPKG_VER="0.6.0"
QPKG_AUTHOR="Silas Mariusz Grzybacz"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="DJ-style VFX for Philips Hue, on the NAS. Requires QuTS hero 6.0 / QTS 6.0."

# Start/stop ordering + the service script.
QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="tunethathue.sh"

# The daemon serves its browser panel on this loopback port; QNAP proxies to it.
QPKG_SERVICE_PORT="58091"
QPKG_WEBUI="/"
QPKG_WEB_PORT="58091"
QPKG_USE_PROXY="1"
QPKG_PROXY_PATH="/TuneThatHue"

# Built and tested for QuTS hero 6.0 / QTS 6.0, but the number here is the one the
# firmware REPORTS: App Center compares this against "Version" in
# /etc/config/uLinux.conf, and a QuTS hero 6.0.1 box still writes 5.2.10 there.
# Asking for 6.0.0 makes the package refuse to install on the firmware it targets
# (verified on hero 6.0.1).
QTS_MINI_VERSION="5.2.10"
QPKG_TIMEOUT="30,30"

# Visible to all NAS users on the Main menu.
QPKG_VISIBLE="2"
QPKG_FORCE_VISIBLE="3"

QDK_DATA_DIR_ICONS="icons"
QDK_DATA_DIR_SHARED="shared"
